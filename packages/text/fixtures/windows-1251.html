<title>Форум — Тема</title>
</head><body><article><h1>Судоходная компания</h1>
<p>Танкер сменил флаг три раза за один год, и каждый новый владелец был новой подставной компанией.</p>
<p>Ёлка, щука, объявление: буквы Ё, Щ и Ъ стоят в этом тексте.</p>
<p>Кредитор этой компании находится в портовом городе, и запись реестра называет его адрес и дату регистрации.</p>
