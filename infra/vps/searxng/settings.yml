# SearXNG settings for GAB. Only the values that differ from the defaults are here.
# server.secret_key comes from SEARXNG_SECRET in /root/gab-services/.env, never from this file.
use_default_settings: true

general:
  instance_name: gab-search

server:
  # The port is bound to the Tailscale address only. The limiter needs a Valkey service, and
  # one client on a private network does not need it.
  limiter: false
  public_instance: false
  image_proxy: false

search:
  safe_search: 0
  # json is required: the web_search tool reads /search?q=...&format=json.
  formats:
    - html
    - json
