# The services that run on the VPS: the model gateway (freellmapi) and the search service
# (SearXNG). They hold no record of the project. freellmapi keeps the provider keys in its volume.
# See infra/vps/README.md, step 5.
#
# The env file is /home/claude/gab-services/.env, outside the checkout, because an agent of the night run
# works in the checkout. Start the services with:
#   docker compose --env-file /home/claude/gab-services/.env -f services.compose.yml up -d --wait
#
# Every port is bound to the Tailscale address of the VPS, and never to 0.0.0.0. The services have
# no authentication that is safe on the public internet: freellmapi is single-user, and SearXNG
# without its limiter is an open proxy.
#
# Every image tag is pinned (ADR 0002 §5). Put the tags in /home/claude/gab-services/.env.
name: gab-services

services:
  freellmapi:
    image: ghcr.io/tashfeenahmed/freellmapi:${FREELLMAPI_TAG:?set FREELLMAPI_TAG in /home/claude/gab-services/.env}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      ENCRYPTION_KEY: ${FREELLMAPI_ENCRYPTION_KEY:?set FREELLMAPI_ENCRYPTION_KEY in /home/claude/gab-services/.env}
    ports:
      # Host port 4001, not 3001: the test stack binds 127.0.0.1:3001 for postgrest-test, and the
      # SSH tunnel fallback of step 5 would collide with it.
      - '${BIND_IP:?set BIND_IP in /home/claude/gab-services/.env}:4001:3001'
    volumes:
      - freellmapi-data:/app/server/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/api/ping').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  searxng:
    image: searxng/searxng:${SEARXNG_TAG:?set SEARXNG_TAG in /home/claude/gab-services/.env}
    restart: unless-stopped
    environment:
      SEARXNG_BASE_URL: http://${BIND_IP}:8888/
      # This value replaces server.secret_key of settings.yml.
      SEARXNG_SECRET: ${SEARXNG_SECRET:?set SEARXNG_SECRET in /home/claude/gab-services/.env}
    ports:
      - '${BIND_IP}:8888:8080'
    volumes:
      - ../searxng/settings.yml:/etc/searxng/settings.yml:ro
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=4)"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  freellmapi-data:
