# The service that runs on the VPS: the search service (SearXNG). It holds no record of the
# project.
# See infra/vps/README.md, step 5.
#
# The env file is ~/gab-services/.env, outside the checkout, because an agent
# works in the checkout. Start the services with:
#   docker compose --env-file ~/gab-services/.env -f services.compose.yml up -d --wait
#
# Every port is bound to the Tailscale address of the VPS, and never to 0.0.0.0. SearXNG has no
# authentication that is safe on the public internet: without its limiter it is an open proxy.
#
# The image tag is pinned (ADR 0002). Put the tag in ~/gab-services/.env.
name: gab-services

services:
  searxng:
    image: searxng/searxng:${SEARXNG_TAG:?set SEARXNG_TAG in ~/gab-services/.env}
    restart: unless-stopped
    environment:
      SEARXNG_BASE_URL: http://${BIND_IP}:8888/
      # This value replaces server.secret_key of settings.yml.
      SEARXNG_SECRET: ${SEARXNG_SECRET:?set SEARXNG_SECRET in ~/gab-services/.env}
    ports:
      - '${BIND_IP}:8888:8080'
    volumes:
      - ../searxng/settings.yml:/etc/searxng/settings.yml:ro
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=4)"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
