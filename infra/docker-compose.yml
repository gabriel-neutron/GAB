# The services of the first build (T5). See docs/adr/0002-local-runtime.md.
#
# Every port is bound to 127.0.0.1. Nothing is reachable from outside this machine.
# Every image tag is pinned. An upstream change must arrive through a commit.
name: gab

services:
  db:
    build: ./postgres
    image: gab-postgres:17-3.5-pgvector
    restart: unless-stopped
    environment:
      POSTGRES_DB: gabriel
      POSTGRES_USER: gabriel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/.env}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - gab-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gabriel -d gabriel']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  # PostgREST connects as gabriel_read and serves the api schema only. The authenticator role and
  # the anonymous role are the same role: a role may always SET ROLE to itself, so no fifth role
  # exists.
  postgrest:
    image: postgrest/postgrest:v16.2
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: "postgres://gabriel_read:\
        ${GABRIEL_READ_PASSWORD:?set GABRIEL_READ_PASSWORD in infra/.env}\
        @db:5432/gabriel"
      PGRST_DB_SCHEMAS: api
      PGRST_DB_ANON_ROLE: gabriel_read
      PGRST_OPENAPI_MODE: disabled
      # No row cap is set. The mechanism that exempts the two full reads is still an open question,
      # and the 5s statement_timeout of gabriel_read already bounds every request.
    ports:
      - '127.0.0.1:3000:3000'

  # The same read service over the test database. The suite reads through it, and a reader of the
  # record never meets the rows a test writes.
  postgrest-test:
    image: postgrest/postgrest:v16.2
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: "postgres://gabriel_read:\
        ${GABRIEL_READ_PASSWORD:?set GABRIEL_READ_PASSWORD in infra/.env}\
        @db:5432/gabriel_test"
      PGRST_DB_SCHEMAS: api
      PGRST_DB_ANON_ROLE: gabriel_read
      PGRST_OPENAPI_MODE: disabled
    ports:
      - '127.0.0.1:3001:3000'

  # The raw store: an S3 server that keeps each source file exactly as it arrived (T3, ADR 0007).
  # The accounts and their rights are in seaweedfs/s3.json, and the keys come from infra/.env.
  # Each key holds letters, digits, '.', '_', '+' and '-' only. `-bucket=raw` makes the private
  # bucket at start, so no init job runs. Only the S3 port leaves the container.
  seaweedfs:
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    restart: unless-stopped
    command:
      - mini
      - -s3.port=9000
      - -s3.config=/etc/seaweedfs/s3.json
      - -bucket=raw
      - -admin.ui=false
      - -webdav=false
      - -s3.port.iceberg=0
      - -s3.port.lance=0
    environment:
      RAW_STORE_ACCESS_KEY: ${RAW_STORE_ACCESS_KEY:?set RAW_STORE_ACCESS_KEY in infra/.env}
      RAW_STORE_SECRET_KEY: ${RAW_STORE_SECRET_KEY:?set RAW_STORE_SECRET_KEY in infra/.env}
      RAW_STORE_ADMIN_ACCESS_KEY: ${RAW_STORE_ADMIN_ACCESS_KEY:?set RAW_STORE_ADMIN_ACCESS_KEY in infra/.env}
      RAW_STORE_ADMIN_SECRET_KEY: ${RAW_STORE_ADMIN_SECRET_KEY:?set RAW_STORE_ADMIN_SECRET_KEY in infra/.env}
      RAW_STORE_RESEARCH_ACCESS_KEY: ${RAW_STORE_RESEARCH_ACCESS_KEY:?set RAW_STORE_RESEARCH_ACCESS_KEY in infra/.env}
      RAW_STORE_RESEARCH_SECRET_KEY: ${RAW_STORE_RESEARCH_SECRET_KEY:?set RAW_STORE_RESEARCH_SECRET_KEY in infra/.env}
      RAW_STORE_READ_ACCESS_KEY: ${RAW_STORE_READ_ACCESS_KEY:?set RAW_STORE_READ_ACCESS_KEY in infra/.env}
      RAW_STORE_READ_SECRET_KEY: ${RAW_STORE_READ_SECRET_KEY:?set RAW_STORE_READ_SECRET_KEY in infra/.env}
    ports:
      - '127.0.0.1:9000:9000'
    volumes:
      - gab-raw-data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:9000/healthz']
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 6

  # The search engine of the web_search tool. The settings file turns JSON output on and the
  # limiter off. The fallback secret is public and fits a loopback port only: set SEARXNG_SECRET in
  # infra/.env to replace it.
  searxng:
    image: searxng/searxng:2026.10.2-19ffbcd30
    restart: unless-stopped
    environment:
      SEARXNG_BASE_URL: http://127.0.0.1:8888/
      SEARXNG_SECRET: ${SEARXNG_SECRET:-gab-local-searxng-loopback-only-secret}
    ports:
      - '127.0.0.1:8888:8080'
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=4)"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  gab-db-data:
  gab-raw-data:
