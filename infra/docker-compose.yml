# The services of the first build (T5). See docs/adr/0002-local-runtime.md.
#
# Every port is bound to 127.0.0.1. Nothing is reachable from outside this machine.
# Every image tag is pinned. An upstream change must arrive through a commit.
name: gab

services:
  db:
    build: ./postgres
    image: gab-postgres:17-3.5-pgvector
    restart: unless-stopped
    environment:
      POSTGRES_DB: gabriel
      POSTGRES_USER: gabriel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/.env}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - gab-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gabriel -d gabriel']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  # PostgREST connects as gabriel_read and serves the api schema only. The authenticator role and
  # the anonymous role are the same role: a role may always SET ROLE to itself, so no fifth role
  # exists.
  postgrest:
    image: postgrest/postgrest:v16.2
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: "postgres://gabriel_read:\
        ${GABRIEL_READ_PASSWORD:?set GABRIEL_READ_PASSWORD in infra/.env}\
        @db:5432/gabriel"
      PGRST_DB_SCHEMAS: api
      PGRST_DB_ANON_ROLE: gabriel_read
      PGRST_OPENAPI_MODE: disabled
      # No row cap is set. The mechanism that exempts the two full reads is still an open question,
      # and the 5s statement_timeout of gabriel_read already bounds every request.
    ports:
      - '127.0.0.1:3000:3000'

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in infra/.env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in infra/.env}
    ports:
      # 9000 is the S3 API. 9001 is the console you open in a browser.
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - gab-minio-data:/data

  # Runs on every up, and it is written to be repeatable. `mc admin user add` writes the secret
  # of an existing account again, so two people on one stack must hold the same infra/.env.
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in infra/.env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in infra/.env}
      RAW_STORE_ACCESS_KEY: ${RAW_STORE_ACCESS_KEY:?set RAW_STORE_ACCESS_KEY in infra/.env}
      RAW_STORE_SECRET_KEY: ${RAW_STORE_SECRET_KEY:?set RAW_STORE_SECRET_KEY in infra/.env}
    volumes:
      - ./minio:/policy:ro
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        # Without this, every command below may fail and the container still exits 0, because the
        # exit code is the code of the last line. A door that was never built looked healthy.
        set -e
        until mc alias set gab http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null 2>&1; do
          echo "waiting for minio"; sleep 2;
        done
        mc mb --ignore-existing gab/raw
        # T3 makes the raw file evidence. The bucket is private: no anonymous read.
        mc anonymous set none gab/raw
        mc admin policy create gab raw-write /policy/policy-raw-write.json
        mc admin user add gab "$$RAW_STORE_ACCESS_KEY" "$$RAW_STORE_SECRET_KEY"
        # An attach that is already in effect is an error, and this file runs again on every up.
        mc admin policy attach gab raw-write --user "$$RAW_STORE_ACCESS_KEY" || true
        mc ls gab
        echo "bucket raw is ready and private"

volumes:
  gab-db-data:
  gab-minio-data:
