# The services of the first build (T5). See docs/adr/0002-local-runtime.md.
#
# Every port is bound to 127.0.0.1. Nothing is reachable from outside this machine.
# Every image tag is pinned. An upstream change must arrive through a commit.
name: gab

services:
  db:
    build: ./postgres
    image: gab-postgres:17-3.5-pgvector
    restart: unless-stopped
    environment:
      POSTGRES_DB: gabriel
      POSTGRES_USER: gabriel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/.env}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - gab-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gabriel -d gabriel']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  # PostgREST connects as gabriel_read and serves the api schema only. The authenticator role and
  # the anonymous role are the same role: a role may always SET ROLE to itself, so no fifth role
  # exists.
  postgrest:
    image: postgrest/postgrest:v16.2
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: "postgres://gabriel_read:\
        ${GABRIEL_READ_PASSWORD:?set GABRIEL_READ_PASSWORD in infra/.env}\
        @db:5432/gabriel"
      PGRST_DB_SCHEMAS: api
      PGRST_DB_ANON_ROLE: gabriel_read
      PGRST_OPENAPI_MODE: disabled
      # No row cap is set. The mechanism that exempts the two full reads is still an open question,
      # and the 5s statement_timeout of gabriel_read already bounds every request.
    ports:
      - '127.0.0.1:3000:3000'

  # The same read service over the test database. The suite reads through it, and a reader of the
  # record never meets the rows a test writes.
  postgrest-test:
    image: postgrest/postgrest:v16.2
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: "postgres://gabriel_read:\
        ${GABRIEL_READ_PASSWORD:?set GABRIEL_READ_PASSWORD in infra/.env}\
        @db:5432/gabriel_test"
      PGRST_DB_SCHEMAS: api
      PGRST_DB_ANON_ROLE: gabriel_read
      PGRST_OPENAPI_MODE: disabled
    ports:
      - '127.0.0.1:3001:3000'

  # The model gateway of the back-end AI (ADR 0010 §4). It holds no record of the project. It keeps
  # the provider keys, encrypted, in its own volume, and the operator enters them on its Keys page.
  # The host port is 4001, because 127.0.0.1:3001 belongs to postgrest-test.
  freellmapi:
    image: ghcr.io/tashfeenahmed/freellmapi:v0.13.3
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      ENCRYPTION_KEY: ${FREELLMAPI_ENCRYPTION_KEY:?set FREELLMAPI_ENCRYPTION_KEY in infra/.env}
    ports:
      - '127.0.0.1:4001:3001'
    volumes:
      - freellmapi-data:/app/server/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/api/ping').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  # The search engine of the web_search tool. The settings file turns JSON output on and the
  # limiter off. The fallback secret is public and fits a loopback port only: set SEARXNG_SECRET in
  # infra/.env to replace it.
  searxng:
    image: searxng/searxng:2026.10.2-19ffbcd30
    restart: unless-stopped
    environment:
      SEARXNG_BASE_URL: http://127.0.0.1:8888/
      SEARXNG_SECRET: ${SEARXNG_SECRET:-gab-local-searxng-loopback-only-secret}
    ports:
      - '127.0.0.1:8888:8080'
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=4)"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  gab-db-data:
  freellmapi-data:
