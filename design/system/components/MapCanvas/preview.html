<!-- @dsCard group="Canvas" height=470 subtitle="Basemap, markers, track, transfer, event" -->
<style>
  .mc { position:relative; height:440px; border:1px solid var(--divider); overflow:hidden; background:var(--map-water); }
  .mc > svg { width:100%; height:100%; display:block; }
  .mc .land { fill:var(--map-land); stroke:var(--map-boundary); stroke-width:1px; }
  .mc .border { fill:none; stroke:var(--map-boundary); stroke-width:1px; stroke-dasharray:3 3; }
  .mc .place { font:400 12px var(--font-sans); fill:var(--map-label); }
  .mc .sea { font:400 12px var(--font-mono); fill:var(--map-label); letter-spacing:2px; text-transform:uppercase; }
  .mc .track { fill:none; stroke:var(--entity-vessel); stroke-width:1.5px; opacity:.6; }
  .mc .sts { fill:none; stroke-width:2px; }
  .mc .ring { fill:none; stroke:var(--ring); stroke-width:2px; }
  .mc .pulse { fill:none; stroke:var(--signal); stroke-width:1px; }
  .mc .halo { fill:var(--map-water); }
  .mc .chips { position:absolute; top:12px; left:12px; display:flex; gap:6px; }
  .mc .chip { height:28px; padding:0 10px; display:inline-flex; align-items:center; gap:6px; border:1px solid var(--border); border-radius:var(--radius-sm); background:var(--surface); font-size:12px; color:var(--foreground); }
  .mc .chip[aria-pressed=false] { color:var(--muted-foreground); background:transparent; }
  .mc .scale { position:absolute; left:12px; bottom:12px; display:flex; flex-direction:column; gap:4px; }
  .mc .scale i { display:block; width:96px; height:4px; border:1px solid var(--label); border-top:0; }
  .mc .coord { position:absolute; right:12px; bottom:12px; }
</style>
