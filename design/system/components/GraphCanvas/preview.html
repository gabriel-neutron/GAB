  .gc .ring { fill:none; stroke:var(--ring); stroke-width:2px; }
  .gc .bar { position:absolute; top:12px; left:12px; right:12px; display:flex; justify-content:space-between; align-items:center; }
  .gc .legend { position:absolute; left:12px; bottom:12px; background:var(--surface); border:1px solid var(--border); padding:10px 12px; display:grid; grid-template-columns:auto auto; gap:6px 16px; }
  .gc .legend span { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--muted-foreground); }
