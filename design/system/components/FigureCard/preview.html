<!-- @dsCard group="Report" height=330 subtitle="The bright card on dark ground" -->
<div style="padding:24px;display:flex;gap:24px;align-items:flex-start">
  <div class="gab-figure" style="width:420px;display:flex;flex-direction:column;gap:16px">
    <span class="gab-caption" style="display:flex;gap:8px;align-items:center"><span class="gab-pulse"></span>Key finding</span>
    <span style="font:400 36px/1.1 var(--font-sans);letter-spacing:-1.12px">43% of the fleet changed insurer within six months of designation.</span>
    <span class="gab-data">Source: GAB graph, 612 vessels, counted 2025-10-01</span>
    <button class="gab-btn" style="align-self:flex-start;background:var(--on-figure);color:var(--figure)">See the vessels</button>
  </div>
</div>
