<style>
  .hc { width:280px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm); box-shadow:var(--shadow-hairline); }
  .hc header { padding:12px; display:flex; flex-direction:column; gap:6px; border-bottom:1px solid var(--divider); }
  .hc .r { display:flex; justify-content:space-between; padding:6px 12px; font-size:12px; }
</style>
<div style="padding:24px;background:var(--background)">
  <div class="hc" role="tooltip">
    <header>
      <span class="gab-caption" style="display:flex;gap:6px;align-items:center"><svg class="gab-glyph g-vessel" style="width:14px;height:14px" viewBox="-7 -7 14 14" aria-hidden="true"><path d="M0,-6 L6,5 L-6,5Z"/></svg>Vessel · IMO 9312345</span>
      <span style="font-size:14px">NS Champion</span>
    </header>
    <div class="r"><span class="gab-muted">Flag</span><span class="gab-data">Gabon, since 2024-02</span></div>
    <div class="r"><span class="gab-muted">Relations</span><span class="gab-data">7</span></div>
  </div>
</div>
