# The web application stays at the root, and each new deployable part is a folder under
# `packages/`. The dot is required, or a filter on the root package finds nothing.
packages:
  - '.'
  - 'packages/*'

# pnpm writes this file itself. Two settings live in it.
#
# `allowBuilds` lets two packages run their install script. Each script only selects the
# prebuilt binary for this platform; neither compiles anything.
#
# `unrs-resolver` is the resolver that `eslint-import-resolver-typescript` uses to follow the
# `@/*` alias. Without it the boundaries rules resolve nothing and report a safety they do not
# give.
#
# `esbuild` arrives with Storybook — `@storybook/csf-plugin` and `@storybook/builder-vite` both
# depend on it (#60). Vite 8 itself uses rolldown and does not. Without the script the binary
# is absent and every Storybook command fails at startup.
allowBuilds:
  esbuild: true
  unrs-resolver: true

# `minimumReleaseAgeExclude` records the packages installed before the age gate would have
# released them. pnpm added each line.
minimumReleaseAgeExclude:
  - '@tanstack/react-router@1.170.25'
  - '@tanstack/router-core@1.171.21'
  - '@boundaries/elements@3.1.1'
  - '@tanstack/router-cli@1.167.27'
  - '@tanstack/router-generator@1.167.27'
  - '@tanstack/router-plugin@1.168.29'
  - eslint-plugin-boundaries@7.2.0
