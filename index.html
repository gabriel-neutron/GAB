<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GAB dataset</title>
    <!-- The icon is in the page, so the browser asks the host for no icon file. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2016%2016%22%3E%3Crect%20width%3D%2216%22%20height%3D%2216%22%20fill%3D%22%230b6aa2%22%2F%3E%3Crect%20x%3D%224%22%20y%3D%224%22%20width%3D%228%22%20height%3D%228%22%20fill%3D%22%23f5f7f9%22%2F%3E%3C%2Fsvg%3E"
    />
    <script>
      // This script sets the theme class before the first paint. No React code can do it: the
      // entry point is a module script, and a module script always waits for the parser. Without
      // this, an operator who chose the dark theme sees a white page at each load.
      //
      // The key and the shape below are a copy. The one source is `keyOf` in
      // `src/shared/storage.ts` and `ShellWorkspace` in `src/shared/theme-provider.tsx`. No
      // check holds the two in step, so change all three together.
      //
      // Every fault is silent on purpose. `localStorage` throws when the browser refuses
      // storage, and `JSON.parse` throws on a damaged value. A throw here stops the parser, and
      // the effect in the theme provider sets the same class one moment later anyway.
      try {
        var raw = localStorage.getItem('gab.shell.v1');
        var theme = raw === null ? 'light' : JSON.parse(raw).theme;
        if (theme !== 'dark' && theme !== 'light' && theme !== 'system') theme = 'light';
        var dark =
          theme === 'dark' ||
          (theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.add(dark ? 'dark' : 'light');
      } catch {
        // Add no class. The page paints light, and the theme provider corrects it at mount.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
