# The gates that nobody has to remember. Two jobs run on each pull request.
#
# `no-stack` reaches no service: the type check, the lint, the format check, the build and the
# check that the generated files match the committed ones.
#
# `stack` starts the services that the suite reaches (the database, the read service of the test
# database and the S3 store), builds the test database from zero, runs the drift check against it,
# and then runs the whole suite. The database owns the data rules, so this job is the one check
# that proves a perimeter, a role, a grant or a row. Each secret of the stack is a random value
# that the job makes and drops: the stack holds no real data, so no repository secret is needed.
#
# The cost is split by the change. A pull request into `main`, and a push to `main`, run both
# jobs in full: it is the last gate. A pull request into any other branch (`staging`, a stacked
# branch) that changes documents alone (`docs/`, `research/`, a Markdown file at the root) runs no job. The
# `changes` job decides. A job that is skipped counts as passed for a required check.

name: gates

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # A push to `main` and a pull request into `main` always count as code. For any other pull
      # request, a file outside the document paths counts as code.
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ] || [ "$BASE_REF" = "main" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only --no-renames "$BASE_SHA...$HEAD_SHA")
          if printf '%s\n' "$files" \
            | grep -Ev '^(docs/|research/)|^[^/]+\.md$|^(LICENSE|Project-Status-Report\.html)$' \
            | grep -q .; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  no-stack:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      # The version comes from `.nvmrc`, so the runner and the workstation read one number.
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Frozen, because a lockfile that a runner may rewrite proves nothing about the tree the
      # operator installed.
      - run: pnpm install --frozen-lockfile

      # The type check, the lint and the format check.
      - run: pnpm run check

      # The production build must compile.
      - run: pnpm run build

      # `tsr generate` runs inside the type check and writes the route tree. `--porcelain` names
      # an untracked file as well as a changed one, so a new generated route fails here too. A
      # tree that differs from the committed one is a stale file and not a silent repair.
      - name: the generated files match the committed ones
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            git diff
            exit 1
          fi

  stack:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The story project runs in a real Chromium. Only that browser is installed: the suite
      # asks for no other, and each one costs a download on every run.
      - run: pnpm exec playwright install --with-deps chromium

      # Each name of the example gets a random value of letters and digits, so the file sets
      # every name the suite expects, the compose file starts, and each access key differs.
      - name: a throwaway environment for the stack
        run: |
          while IFS= read -r line; do
            if [[ "$line" =~ ^[[:space:]]*([A-Z_][A-Z0-9_]*)[[:space:]]*= ]]; then
              echo "${BASH_REMATCH[1]}=$(openssl rand -hex 16)"
            fi
          done < infra/.env.example > infra/.env

      # Only the services that the suite reaches. The model gateway and the search service are
      # stubbed in each test that uses them.
      - name: start the database and the S3 store
        run: >-
          docker compose --env-file infra/.env -f infra/docker-compose.yml -p gab
          up --detach --wait --wait-timeout 300 db seaweedfs

      - run: pnpm run db:reset

      # The reset sets the password of the read role. A read service that starts before it fails
      # its login, waits longer after each failure, and can miss the first tests.
      - name: start the read service of the test database
        run: >-
          docker compose --env-file infra/.env -f infra/docker-compose.yml -p gab
          up --detach --wait --wait-timeout 300 postgrest-test

      - run: pnpm run db:drift

      - run: pnpm test

      - name: the logs of the stack
        if: failure()
        run: docker compose --env-file infra/.env -f infra/docker-compose.yml -p gab logs --tail 200
