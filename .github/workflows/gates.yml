# The gates that nobody has to remember. Two jobs run on each pull request.
#
# `no-stack` reaches no service: the type check, the lint, the format check, the build, the
# accessibility check of the stories and the check that the generated files match the committed ones.
#
# `stack` starts the services that the suite reaches (the database, the read service of the test
# database and the S3 store), builds the test database from zero, runs the drift check against it,
# and then runs the whole suite. The database owns the data rules, so this job is the one check
# that proves a perimeter, a role, a grant or a row. Each secret of the stack is a random value
# that the job makes and drops: the stack holds no real data, so no repository secret is needed.
#
# The cost is split by the branch. The `changes` job sets a tier:
#   full  a pull request into `main`, and a push to `main` or `staging`: every job and the whole
#         suite, the end-to-end test included.
#   fast  any other pull request: `no-stack` and the offline tests. The stack does not start.
#   none  any other pull request that changes documents alone (`docs/`, `research/`, a Markdown
#         file at the root): no job.
# A job that is skipped counts as passed for a required check.

name: gates

on:
  push:
    branches: [main, staging]
  pull_request:
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tier: ${{ steps.diff.outputs.tier }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref_name }}
          BASE_REF: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" = "push" ]; then
            echo "tier=full" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$BASE_REF" = "main" ]; then
            echo "tier=full" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only --no-renames "$BASE_SHA...$HEAD_SHA")
          if printf '%s\n' "$files" \
            | grep -Ev '^(docs/|research/)|^[^/]+\.md$|^LICENSE$' \
            | grep -q .; then
            echo "tier=fast" >> "$GITHUB_OUTPUT"
          else
            echo "tier=none" >> "$GITHUB_OUTPUT"
          fi

      # The repository is public, and the e-mail of a commit stays in the history forever. Each
      # commit of a pull request must carry a GitHub noreply address as author and as committer.
      # The step names only the hash, because the log of a job is public too. The GitHub setting
      # that blocks a push checks only the newest commit of the push, so this step checks them all.
      - name: each commit carries a noreply e-mail
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -o pipefail
          noreply='(@users\.noreply\.github\.com|^noreply@github\.com)$'
          bad=$(git log --format='%h %ae %ce' "$BASE_SHA..$HEAD_SHA" \
            | while read -r hash author committer; do
                if ! printf '%s' "$author" | grep -Eq "$noreply" \
                  || ! printf '%s' "$committer" | grep -Eq "$noreply"; then
                  echo "$hash"
                fi
              done)
          if [ -n "$bad" ]; then
            echo "These commits carry an e-mail that is not a GitHub noreply address:"
            echo "$bad"
            echo "Set the noreply address with git config (infra/vps/README.md, step 4), then rewrite them."
            exit 1
          fi

  no-stack:
    needs: changes
    if: needs.changes.outputs.tier != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      # The version comes from `.nvmrc`, so the runner and the workstation read one number.
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Frozen, because a lockfile that a runner may rewrite proves nothing about the tree the
      # operator installed.
      - run: pnpm install --frozen-lockfile

      # The type check, the lint and the format check.
      - run: pnpm run check

      # The production build must compile.
      - run: pnpm run build

      # The accessibility check: each story runs the axe rules, in the light theme and then in the
      # dark theme. A fault fails the step. The stories need Chromium and no service.
      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm run test:a11y

      - run: pnpm run test:a11y:dark

      # `tsr generate` runs inside the type check and writes the route tree. `--porcelain` names
      # an untracked file as well as a changed one, so a new generated route fails here too. A
      # tree that differs from the committed one is a stale file and not a silent repair.
      # The part of the suite that reaches no service. The `stack` job runs it again inside the
      # larger run, so this step runs only when the stack does not start.
      - if: needs.changes.outputs.tier == 'fast'
        run: pnpm run test:fast

      - name: the generated files match the committed ones
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            git diff
            exit 1
          fi

  stack:
    needs: changes
    if: needs.changes.outputs.tier == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The story project runs in a real Chromium. Only that browser is installed: the suite
      # asks for no other, and each one costs a download on every run.
      - run: pnpm exec playwright install --with-deps chromium

      # Each name of the example gets a random value of letters and digits, so the file sets
      # every name the suite expects, the compose file starts, and each access key differs.
      - name: a throwaway environment for the stack
        run: |
          while IFS= read -r line; do
            if [[ "$line" =~ ^[[:space:]]*([A-Z_][A-Z0-9_]*)[[:space:]]*= ]]; then
              echo "${BASH_REMATCH[1]}=$(openssl rand -hex 16)"
            fi
          done < infra/.env.example > infra/.env

      # Only the services that the suite reaches. The model gateway and the search service are
      # stubbed in each test that uses them.
      - name: start the database and the S3 store
        run: >-
          docker compose --env-file infra/.env -f infra/docker-compose.yml -p gab
          up --detach --wait --wait-timeout 300 db seaweedfs

      - run: pnpm run db:reset

      # The reset sets the password of the read role. A read service that starts before it fails
      # its login, waits longer after each failure, and can miss the first tests.
      - name: start the read service of the test database
        run: >-
          docker compose --env-file infra/.env -f infra/docker-compose.yml -p gab
          up --detach --wait --wait-timeout 300 postgrest-test

      - run: pnpm run db:drift

      - run: pnpm run test

      - name: the logs of the stack
        if: failure()
        run: docker compose --env-file infra/.env -f infra/docker-compose.yml -p gab logs --tail 200
